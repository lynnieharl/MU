<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN SYSTEM CONTROL</title>
    <!-- Nhúng Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d0d0d; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Auth Box */
        .auth-container { background: #1a1a1a; padding: 30px; border-radius: 8px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; margin-bottom: 20px; font-size: 20px; letter-spacing: 1px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #e50914; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: #e50914; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #b80710; }

        /* Dashboard Screen */
        #dashboard-screen { display: none; width: 100%; min-height: 100vh; background: #121212; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .btn-logout { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .crud-box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .crud-box input { padding: 8px; margin-right: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #1a1a1a; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #222; }
        .btn-delete { background: #ff4d4d; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="auth-container">
        <h2>ADMIN SYSTEM CONTROL</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">ĐĂNG NHẬP</button>
            <button class="tab-btn" onclick="switchTab('register')">ĐĂNG KÝ TÀI KHOẢN</button>
        </div>

        <!-- Form Đăng nhập -->
        <form id="form-login" onsubmit="xuLyDangNhap(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="admin@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>

        <!-- Form Đăng ký -->
        <form id="form-register" style="display: none;" onsubmit="xuLyDangKy(event)">
            <div class="form-group">
                <label>Email Admin Mới</label>
                <input type="email" id="reg-email" required placeholder="admin@gmail.com">
            </div>
            <div class="form-group">
                <label>Password (>= 6 ký tự)</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" style="background: #28a745;">Tạo Tài Khoản Admin</button>
        </form>
    </div>

    <!-- MÀN HÌNH QUẢN TRỊ ADMIN (ẨN MẶC ĐỊNH) -->
    <div id="dashboard-screen">
        <div class="header">
            <h1>CHÀO MỪNG ADMIN: <span id="admin-email-display" style="color: #28a745;"></span></h1>
            <button class="btn-logout" onclick="dangXuat()">Đăng Xuất</button>
        </div>

        <div class="crud-box">
            <h3>+ Thêm Sản Phẩm Mới</h3>
            <form onsubmit="themSanPham(event)" style="margin-top: 10px;">
                <input type="text" id="p-name" placeholder="Tên sản phẩm" required>
                <input type="text" id="p-price" placeholder="Giá (VD: $100)" required>
                <input type="text" id="p-img" placeholder="Link ảnh (URL)" required>
                <button type="submit" class="btn-submit" style="width: auto; display: inline-block;">Thêm Kho</button>
            </form>
        </div>

        <h3>Danh Sách Sản Phẩm Trong Database</h3>
        <table style="margin-top: 10px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Dữ liệu từ Supabase sẽ đổ vào đây -->
            </tbody>
        </table>
    </div>

    <script>
        // CẤU HÌNH SUPABASE
        const SUPABASE_URL = 'https://suabbqtrggzwgchksenq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E711W3fBxwZeRVYH3TOBAA_ZNoe_wps';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Đổi tab Đăng nhập / Đăng ký
        function switchTab(type) {
            const btnLog = document.querySelectorAll('.tab-btn')[0];
            const btnReg = document.querySelectorAll('.tab-btn')[1];
            const formLog = document.getElementById('form-login');
            const formReg = document.getElementById('form-register');

            if (type === 'login') {
                btnLog.classList.add('active');
                btnReg.classList.remove('active');
                formLog.style.display = 'block';
                formReg.style.display = 'none';
            } else {
                btnReg.classList.add('active');
                btnLog.classList.remove('active');
                formReg.style.display = 'block';
                formLog.style.display = 'none';
            }
        }

        // 1. XỬ LÝ ĐĂNG KÝ ADMIN TỰ ĐỘNG
        async function xuLyDangKy(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                // Tạo user trên Supabase Auth
                const { data: authData, error: authErr } = await supabase.auth.signUp({ email, password });
                if (authErr) throw authErr;

                // Thêm luôn vào bảng users với role là 'admin'
                const { error: dbErr } = await supabase.from('users').insert([{ email: email, role: 'admin' }]);
                if (dbErr) throw dbErr;

                alert("🎉 Tạo tài khoản Admin thành công! Giờ ông có thể Đăng Nhập.");
                switchTab('login');
                document.getElementById('login-email').value = email;
            } catch (err) {
                alert("❌ Lỗi Đăng Ký: " + err.message);
            }
        }

        // 2. XỬ LÝ ĐĂNG NHẬP & PHÂN QUYỀN
        async function xuLyDangNhap(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                // Xác thực tài khoản
                const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({ email, password });
                if (authErr) throw authErr;

                // Kiểm tra xem email này trong bảng 'users' có quyền 'admin' không
                const { data: userData, error: userErr } = await supabase
                    .from('users')
                    .select('role')
                    .eq('email', email)
                    .single();

                if (userErr || !userData || userData.role !== 'admin') {
                    await supabase.auth.signOut();
                    return alert("⛔ LỖI BẢO MẬT: Tài khoản này chưa được cấp quyền Admin!");
                }

                // Nếu đúng Admin -> Mở Dashboard
                alert("✅ Đăng nhập Admin thành công!");
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                document.getElementById('admin-email-display').innerText = email;

                // Load danh sách sản phẩm
                taiDanhSachSanPham();

            } catch (err) {
                alert("❌ Lỗi Đăng Nhập: " + err.message);
            }
        }

        // 3. TẢI SAN PHAM TỪ BẢNG 'products'
        async function taiDanhSachSanPham() {
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = '<tr><td colspan="5">Đang tải dữ liệu kho...</td></tr>';

            try {
                const { data, error } = await supabase.from('products').select('*');
                if (error) throw error;

                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">Kho đang trống sản phẩm.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    tbody.innerHTML += \`
                        <tr>
                            <td>\${item.id}</td>
                            <td><img src="\${item.image_url || 'https://via.placeholder.com/40'}" width="40" height="40" style="object-fit:cover;"></td>
                            <td>\${item.name}</td>
                            <td>\${item.price}</td>
                            <td><button class="btn-delete" onclick="xoaSanPham(\${item.id})">Xóa</button></td>
                        </tr>
                    \`;
                });
            } catch (err) {
                console.error("Lỗi tải SP:", err);
                tbody.innerHTML = '<tr><td colspan="5">Lỗi không thể tải kho hàng (Kiểm tra lại bảng products).</td></tr>';
            }
        }

        // 4. THÊM SẢN PHẨM MỚI
        async function themSanPham(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const image_url = document.getElementById('p-img').value;

            try {
                const { error } = await supabase.from('products').insert([{ name, price, image_url }]);
                if (error) throw error;

                alert("Đã thêm sản phẩm mới vào Supabase!");
                e.target.reset();
                taiDanhSachSanPham();
            } catch (err) {
                alert("❌ Lỗi thêm SP: " + err.message);
            }
        }

        // 5. XÓA SẢN PHẨM
        async function xoaSanPham(id) {
            if (!confirm("Ông chắc chắn muốn xóa sản phẩm này khỏi Database?")) return;

            try {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) throw error;

                alert("Đã xóa!");
                taiDanhSachSanPham();
            } catch (err) {
                alert("❌ Lỗi xóa SP: " + err.message);
            }
        }

        // 6. ĐĂNG XUẤT
        async function dangXuat() {
            await supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
