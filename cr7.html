<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR7 - The Legend</title>
    <!-- Google Fonts for cinematic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; /* Deep dark background */
            overflow: hidden; /* Full-screen hero */
        }

        .cr7-hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('images/cr7_wukong_hero.jpg');
            background-size: cover;
            background-position: center right; /* Focus on the right where CR7 is */
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Dark cinematic gradient overlay emphasizing negative space on the left */
        .cr7-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
            z-index: 1;
        }

        /* Top Minimalist Navigation */
        .cr7-nav {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: center; /* Center the nav as requested */
            gap: 50px;
        }

        .cr7-nav a {
            color: #d4af37; /* Ancient gold */
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .cr7-nav a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        /* Main Typography and Quote */
        .cr7-content {
            position: relative;
            z-index: 2;
            padding-left: 10%;
            max-width: 60%; /* Limit width to fit the left negative space */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cr7-quote {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            line-height: 1.3;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        .cr7-quote-highlight {
            color: #d4af37; /* Gold accent */
        }

        .cr7-author {
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: #a0a0a0;
            font-weight: 400;
            margin-left: 5px;
        }

        /* Bottom Action Button */
        .cr7-footer {
            position: relative;
            z-index: 2;
            padding-bottom: 8vh;
            display: flex;
            justify-content: center;
        }

        .cr7-btn {
            background: linear-gradient(135deg, #2a2a2a 0%, #111 100%);
            border: 1px solid #d4af37; /* Dark gold border */
            color: #d4af37;
            padding: 18px 45px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .cr7-btn:hover {
            background: #d4af37;
            color: #050505;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4), inset 0 0 0 rgba(212, 175, 55, 0);
            transform: translateY(-2px);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .cr7-content {
                max-width: 80%;
                padding-left: 5%;
            }
            .cr7-quote {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 768px) {
            .cr7-hero {
                background-position: center; /* Center image on mobile */
            }
            .cr7-overlay {
                background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0.9) 100%);
            }
            .cr7-nav {
                display: none; /* Hide nav on mobile for simplicity */
            }
            .cr7-content {
                max-width: 90%;
                padding: 0 5%;
                text-align: center;
                justify-content: flex-end;
                padding-bottom: 40px;
            }
            .cr7-quote {
                font-size: 2rem;
            }
            .cr7-author {
                text-align: center;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <section class="cr7-hero">
        <div class="cr7-overlay"></div>
        
        <!-- Navigation Menu -->
        <nav class="cr7-nav">
            <a href="index.html">TRANG CHỦ</a>
            <a href="#">SỰ NGHIỆP</a>
            <a href="#">THƯ VIỆN</a>
            <a href="#">LIÊN HỆ</a>
        </nav>

        <!-- Main Content (Negative space on the left) -->
        <div class="cr7-content">
            <h1 class="cr7-quote">
                "SỐNG LÀ ĐỂ <span class="cr7-quote-highlight">THÁCH THỨC BẢN THÂN</span><br>VÀ CHINH PHỤC NHỮNG ĐỈNH CAO MỚI."
            </h1>
            <p class="cr7-author">- CRISTIANO RONALDO</p>
        </div>

        <!-- Bottom Call to Action -->
        <div class="cr7-footer">
            <a href="#" class="cr7-btn">DISCOVER NOW</a>
        </div>
    </section>

</body>
</html>
